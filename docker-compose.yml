services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: matcher, POSTGRES_PASSWORD: matcher, POSTGRES_DB: resume_matcher }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U matcher"], interval: 3s, retries: 20 }
  app:
    build: .
    environment: { DATABASE_URL: "postgresql://matcher:matcher@db:5432/resume_matcher" }
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {} }
